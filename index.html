<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DSA Progress Tracker</title>

  <!-- Materialize CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    rel="stylesheet"
  />
  <!-- Google Icons -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Font Awesome for social icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <!-- Custom CSS - Must be loaded last to override Materialize -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-content">
      <div class="logo">
        <span class="logo-icon">&lt;/&gt;</span>
        <span>DSA Progress</span>
      </div>
      <button id="darkModeToggle" class="theme-toggle">
        <span class="material-icons">dark_mode</span>
      </button>
    </div>
  </nav>

  <!-- Progress Section -->
  <div id="rectChartContainer" class="rect-chart-container">
    <!-- The progress card is inserted by script.js -->
  </div>

  <!-- Main Content / Problem Sections -->
  <div class="container">
    <!-- Search Box -->
    <div class="search-container">
      <span class="search-icon material-icons">search</span>
      <input type="text" id="searchBox" class="search-input" placeholder="Search problems...">
    </div>
    
    <!-- Section Controls (Expand/Collapse) -->
    <div class="section-controls-container"></div>

    <!-- Problem Sections -->
    <div id="sections"></div>

  </div>

<!-- Go to top button -->
<a id="go-to-top-button"></a> 


  <!-- Modern Footer -->
  <footer class="footer">
    <div class="footer-content">
        <div class="footer-profile">
            <img src="chandanwhite.jpg" alt="Chandan Agrawal" class="profile-image">
            <p class="created-by">Created by Chandan Agrawal</p>
        </div>
        <div class="social-links">
            <!-- <a href="https://github.com/chandanXP" class="social-link" target="_blank" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a> -->
            <a href="https://youtube.com/" class="social-link" target="_blank" aria-label="Youtube">
              <i class="fab fa-youtube"></i>
            </a>
            <a href="https://linkedin.com/in/chandanagrawal23" class="social-link" target="_blank" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://twitter.com/chandan223344" class="social-link" target="_blank" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="mailto:chandandsafeedback@gmail.com" class="social-link" target="_blank" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="https://www.instagram.com/chandan.agrawal23/" class="social-link" target="_blank" aria-label="Instagram">
              <i class="fab fa-instagram"></i>
          </a>
        </div>
    </div>
</footer>

  <!-- Notes Modal -->
  <div id="notesModal" class="notes-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="notesModalTitle">Problem Notes</h2>
      </div>
      <div class="modal-body">
        <textarea id="notesModalTextarea" placeholder="Write your notes here..."></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="saveNotesModal()" class="btn-save btn">Save</button>
        <button onclick="closeNotesModal()" class="btn-close btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
